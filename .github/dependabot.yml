version: 2
updates:
  # Frontend (root) - React + Vite, wlasny pnpm-lock.yaml
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "14:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # wszystkie patch/minor w jednym PR; majory zostaja osobno
      patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Backend (server/) - Hono na Cloudflare Workers, osobny pnpm-lock.yaml
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "14:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(server-deps)"
      prefix-development: "chore(server-deps-dev)"
    groups:
      patch-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # wersje akcji w .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "14:00"
      timezone: "Europe/Warsaw"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
